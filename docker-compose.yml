# One-command production stack for a VPS (e.g. Hostinger KVM): PostgreSQL + CRM + Caddy (automatic HTTPS)
# 1) cp .env.example .env  and fill it in   2) set DOMAIN in .env   3) docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: k3crm
      POSTGRES_USER: k3
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U k3 -d k3crm"], interval: 5s, retries: 10 }
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://k3:${POSTGRES_PASSWORD}@db:5432/k3crm
      PUBLIC_URL: https://${DOMAIN}
    volumes: [uploads:/data/uploads, backups:/data/backups]
    depends_on: { db: { condition: service_healthy } }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN} --to app:8080
    volumes: [caddy_data:/data]
    depends_on: [app]
volumes: { pgdata: {}, uploads: {}, backups: {}, caddy_data: {} }
